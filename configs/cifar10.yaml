experiment:
  name: cifar10_main
  seed: 42
  output_dir: outputs/metrics/cifar10_main

dataset:
  name: cifar10
  root: data/raw
  validation_size: 5000
  stratified_split: true

encoder:
  library: open_clip
  model: ViT-B-32
  pretrained: laion2b_s34b_b79k
  batch_size: 64
  precision: fp16
  cache_dir: outputs/embeddings/cifar10

memory:
  prototypes_per_class: 20
  index_backend: auto
  duplicate_threshold: 0.98
  purity_k: 10
  reliability_weights:
    compactness: 0.40
    text_alignment: 0.20
    purity: 0.40
  max_prototypes: 200
  min_prototypes_per_class: 1

classifier:
  retrieval_k: 10
  visual_temperature: 0.07
  text_temperature: 0.07
  fusion_weight: 0.50

confidence:
  component_weights:
    score: 0.20
    margin: 0.20
    agreement: 0.20
    similarity: 0.20
    reliability: 0.20
  thresholds:
    confidence: null
    similarity: null
    agreement: null

evaluation:
  seeds: [42, 123, 2026]
  prototype_budgets: [1, 2, 5, 10, 20, 50, 100]
  retrieval_k_values: [1, 3, 5, 10, 20, 50]
  fusion_weights: [0.0, 0.25, 0.5, 0.75, 1.0]

