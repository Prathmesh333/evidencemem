experiment:
  name: cifar10_main
  seed: 7
  output_dir: outputs/metrics/cifar10_main

dataset:
  name: cifar10
  root: data/raw
  validation_size: 5000
  stratified_split: true

encoder:
  library: open_clip
  model: ViT-B-32-quickgelu
  pretrained: openai
  batch_size: 64
  precision: fp16
  num_workers: 0
  cache_dir: outputs/embeddings/cifar10

memory:
  prototypes_per_class: 20
  index_backend: auto
  duplicate_threshold: null
  purity_k: 10
  reliability_weights:
    compactness: 0.45
    text_alignment: 0.20
    purity: 0.35
  selection:
    strategy: reliability_facility
    candidate_multiplier: 2.0
    coverage_weight: 0.75
    reliability_weight: 0.25
  max_prototypes: 200
  min_prototypes_per_class: 1

classifier:
  retrieval_k: 10
  visual_temperature: 0.07
  text_temperature: 0.07
  text_weight: 0.50

confidence:
  component_weights:
    score: 0.20
    margin: 0.20
    agreement: 0.20
    similarity: 0.20
    reliability: 0.20
  thresholds:
    confidence: null
    similarity: null
    agreement: null

evaluation:
  seeds: [7, 17, 29]
  prototype_budgets: [1, 2, 5, 10, 20, 50, 100]
  retrieval_k_values: [1, 3, 5, 10, 20, 50]
  text_weights: [0.0, 0.1, 0.25, 0.5, 0.75, 0.9, 1.0]
  tip_adapter_beta: [0.5, 1.0, 2.0, 5.0, 10.0, 20.0]
  tip_adapter_cache_weight: [0.5, 1.0, 2.0, 5.0, 10.0, 20.0]
