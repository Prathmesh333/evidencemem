[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evidencemem"
version = "0.1.0"
description = "Reliability-aware prototype memory for frozen vision-language embeddings"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Prathamesh Nikam"}]
dependencies = [
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
vision = [
  "torch>=2.2",
  "torchvision>=0.17",
  "open_clip_torch>=2.24",
  "faiss-cpu>=1.8; platform_system != 'Windows'",
  "pillow>=10.0",
]
analysis = [
  "matplotlib>=3.8",
  "pandas>=2.2",
  "scipy>=1.12",
  "seaborn>=0.13",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

